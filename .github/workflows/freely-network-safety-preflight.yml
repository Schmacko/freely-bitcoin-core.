name: FREELY network safety preflight

on:
  pull_request:
    paths:
      - 'contrib/freely/**'
      - 'docs/FREELY-NETWORK-SAFETY-PREFLIGHT.md'
      - 'docs/FREELY-PRODUCTION-READINESS-GATE.md'
      - 'docs/FREELY-RPC-P2P-SECURITY-AUDIT.md'
      - '.github/workflows/freely-network-safety-preflight.yml'

permissions:
  contents: read

jobs:
  preflight-tests:
    name: Python preflight tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s contrib/freely -p 'test_check_network_safety.py' -v
      - name: Run production-readiness evidence tests
        run: python -m unittest discover -s contrib/freely -p 'test_check_production_readiness.py' -v
      - name: Confirm production evidence ledger remains blocked without proof
        run: |
          set +e
          python contrib/freely/check_production_readiness.py
          status=$?
          set -e
          test "$status" -eq 1
      - name: Verify approved baseline and candidate genesis commitment status
        run: python contrib/freely/check_network_safety.py
