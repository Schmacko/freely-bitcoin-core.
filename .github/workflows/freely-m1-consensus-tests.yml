name: FREELY M1 consensus tests

on:
  pull_request:
    branches:
      - freely/upstream-v32.1
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/freely-m1-consensus-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freely-m1-consensus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out FREELY fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install minimal build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake python3 libboost-dev

      - name: Configure unit-test build
        run: |
          cmake -B build \
            -DENABLE_WALLET=OFF \
            -DENABLE_IPC=OFF \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=ON

      - name: Build Bitcoin Core unit-test executable
        run: cmake --build build --target test_bitcoin --parallel 2

      - name: Run validation test suite
        run: ctest --test-dir build --output-on-failure -R '^validation_tests$'
