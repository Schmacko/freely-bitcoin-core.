name: FREELY offline wallet tests

on:
  push:
    branches:
      - freely/private-node-integration-20261124
    paths:
      - "src/common/args.cpp"
      - "src/chainparams.cpp"
      - "src/chainparamsbase.cpp"
      - "src/kernel/chainparams.cpp"
      - "src/kernel/chainparams.h"
      - "src/wallet/**"
      - "src/test/key_io_tests.cpp"
      - "src/base58.h"
      - "src/key_io.cpp"
      - "src/rpc/**"
      - "test/functional/feature_freely_offline_wallet.py"
      - "test/functional/test_runner.py"
      - "docs/FREELY-DEVELOPMENT-MODE-NETWORK-SECURITY.md"
      - "docs/FREELY-RPC-P2P-SAFETY-AUDIT.md"
      - "test/functional/feature_freely_loopback_network.py"
      - "test/functional/test_framework/**"
      - ".github/workflows/freely-offline-wallet-tests.yml"
      - ".github/workflows/freely-chainparams-candidate-tests.yml"
  pull_request:
    branches:
      - freely/chainparams-reconciled-20261122
    paths:
      - "src/common/args.cpp"
      - "src/chainparams.cpp"
      - "src/chainparamsbase.cpp"
      - "src/kernel/chainparams.cpp"
      - "src/kernel/chainparams.h"
      - "src/wallet/**"
      - "src/test/key_io_tests.cpp"
      - "src/base58.h"
      - "src/key_io.cpp"
      - "src/rpc/**"
      - "test/functional/feature_freely_offline_wallet.py"
      - "test/functional/test_runner.py"
      - "docs/FREELY-DEVELOPMENT-MODE-NETWORK-SECURITY.md"
      - "docs/FREELY-RPC-P2P-SAFETY-AUDIT.md"
      - "test/functional/feature_freely_loopback_network.py"
      - "test/functional/test_framework/**"
      - ".github/workflows/freely-offline-wallet-tests.yml"
      - ".github/workflows/freely-chainparams-candidate-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freely-offline-wallet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  freely-wallet:
    name: Build wallet-enabled node and test FREELY offline wallet
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install wallet build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake python3 libboost-dev libevent-dev libsqlite3-dev

      - name: Configure wallet-enabled build
        run: |
          cmake -B build \
            -DENABLE_WALLET=ON \
            -DENABLE_IPC=OFF \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=ON \
            -DWITH_ZMQ=OFF

      - name: Build node and CLI
        run: cmake --build build --target bitcoind bitcoin-cli --parallel 2

      - name: Build and test FREELY WIF key encoding
        run: |
          cmake --build build --target test_bitcoin --parallel 2
          ctest --test-dir build --output-on-failure -R '^key_io_tests$'


      - name: Test FREELY wallet address encodings and restart recovery
        run: python3 build/test/functional/test_runner.py --jobs=1 --combinedlogslen=100 feature_freely_offline_wallet.py
